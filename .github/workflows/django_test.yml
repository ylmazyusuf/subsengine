name: Python Tests

on:
    pull_request:
        branches:
            - master

jobs:
    pytest:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: subsengine
                    POSTGRES_PORT: 5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432
        
        steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: '3.14'
        - name: Install Dependencies
          run: |
            python -m pip install --upgrade pip
            python -m pip install -r requirements.txt
        - name: Run Pytests
          run: |
            cd billing
            export DATABASE_URL=psql://postgres:postgres@localhost:5432/subsengine
            export SECRET_KEY=mysecret
            python manage.py migrate
            pytest
